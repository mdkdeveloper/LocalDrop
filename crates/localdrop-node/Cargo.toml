[package]
name = "localdrop-node"
description = "High-level LocalDrop node: the API used by the CLI and the Flutter app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
localdrop-core.workspace = true
localdrop-discovery.workspace = true
localdrop-protocol.workspace = true
localdrop-transport.workspace = true
localdrop-store.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tracing.workspace = true
serde.workspace = true
rand.workspace = true
serde_json.workspace = true
postcard.workspace = true

[features]
# Scripted events for UI work without a network (see docs/node-api.md).
fake = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
